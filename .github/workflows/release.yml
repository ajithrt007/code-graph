name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Focused on windows/mac x64 for faster development. Linux and all
        # arm targets are temporarily commented out — re-enable when needed.
        include:
          - target: macos-x64
            runner: macos-15-intel
            rid: osx-x64
          - target: windows-x64
            runner: windows-2022
            rid: win-x64
          # - target: macos-arm64
          #   runner: macos-14
          #   rid: osx-arm64
          # - target: linux-x64
          #   runner: ubuntu-22.04
          #   rid: linux-x64
          # - target: linux-arm64
          #   runner: ubuntu-22.04-arm
          #   rid: linux-arm64
          # - target: windows-arm64
          #   runner: windows-11-arm
          #   rid: win-arm64
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            fuse
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ matrix.rid }}-${{ hashFiles('packages/roslyn-sys/managed/RoslynBridge/RoslynBridge.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ matrix.rid }}-
            nuget-${{ runner.os }}-
      - name: Build RoslynBridge bundle
        shell: bash
        run: ./scripts/build-roslyn-bridge.sh ${{ matrix.rid }}
      - name: Stage RoslynBridge bundle into Tauri resources
        shell: bash
        run: ./scripts/collect-roslyn-bridge.sh ${{ matrix.rid }}
      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/desktop
      - name: Require updater signing key
        shell: bash
        # Tests emptiness only — the secret value is never printed.
        run: |
          [[ -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]] \
            || { echo "missing TAURI_SIGNING_PRIVATE_KEY secret (see docs/updater.md)" >&2; exit 1; }
      - name: Build Tauri application
        shell: bash
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [[ "${{ matrix.rid }}" == linux-* ]]; then
            # Skip AppImage (linuxdeploy) on Linux; ship deb+rpm only.
            npm run tauri:build -- --bundles deb,rpm
          else
            npm run tauri:build
          fi
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: codegraph-${{ matrix.target }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Verify tag matches app version
        shell: bash
        # The updater compares latest.json against the installed app version;
        # a mismatch would make every install update-loop forever.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf="$(python3 -c "import json; print(json.load(open('apps/desktop/src-tauri/tauri.conf.json'))['version'])")"
          [[ "$tag" == "$conf" ]] \
            || { echo "tag $GITHUB_REF_NAME != tauri.conf.json version $conf; bump the app version first (see docs/updater.md)" >&2; exit 1; }
      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          for dir in artifacts/*/; do
            name="$(basename "$dir")"
            find "$dir" -type f \
              \( -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.tar.gz' \
                 -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
                 -o -name '*.msi' -o -name '*.exe' \
                 -o -name '*.zip' -o -name '*.sig' \) \
              -print0 | while IFS= read -r -d '' f; do
                  cp "$f" "assets/${name}-$(basename "$f")"
                done
          done
          ls -la assets
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(assets/*)
          [[ ${#files[@]} -eq 0 ]] && { echo "no assets to attach" >&2; exit 1; }
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes
      - name: Generate and upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --json body -q .body > "$body_file"
          python3 scripts/generate-latest-json.py \
            --assets-dir assets \
            --tag "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --config apps/desktop/src-tauri/tauri.conf.json \
            --notes-file "$body_file" \
            --out assets/latest.json
          cat assets/latest.json
          gh release upload "$GITHUB_REF_NAME" assets/latest.json \
            --repo "$GITHUB_REPOSITORY" --clobber