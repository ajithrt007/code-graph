[package]
name = "code-graph-desktop"
version = "0.1.0"
description = "CodeGraph desktop app — visualize method-level dependencies in codebases."
authors = ["CodeGraph contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "code_graph_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Roslyn bridge. The actual implementation lives in the companion
# `roslyn-sys` crate which wraps `Microsoft.CodeAnalysis` via a managed
# helper subprocess. Splitting it into its own crate keeps the analyzer
# focused.
roslyn-sys = { path = "../../../packages/roslyn-sys" }

[features]
# Default `tauri` feature set is intentionally minimal; we add custom-protocol
# only because the frontend is bundled.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
