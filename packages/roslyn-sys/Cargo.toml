[package]
name = "roslyn-sys"
version = "0.1.0"
edition = "2021"
description = "Rust bindings to Microsoft.CodeAnalysis (Roslyn). Spawns a managed helper assembly that performs the Roslyn analysis and returns a JSON graph document."

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[features]
default = []